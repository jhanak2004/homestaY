services:
  - type: web
    name: staybook
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: API_BASE_URL
        value: https://homestay-2zyf.onrender.com/api
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: "3002"
